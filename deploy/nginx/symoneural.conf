# Optional reverse proxy. The app itself still exposes one FastAPI service on :8000.

# Basic protection against one client hammering the single GPU. 10 requests/min
# per IP, with a small burst allowance. Tune to taste once you know real traffic.
limit_req_zone $binary_remote_addr zone=symon_limit:10m rate=10r/m;

server {
    listen 80;
    server_name www.symoneural.com symoneural.com;

    client_max_body_size 64m;

    location / {
        limit_req zone=symon_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}

